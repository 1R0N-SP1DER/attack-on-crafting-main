name: Validate add-on
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export check (models -> RP is up to date)
        run: |
          python3 tools/export_bbmodels.py
          git diff --exit-code --stat RP || (echo "RP is out of date: run tools/export_bbmodels.py and commit" && exit 1)
      - name: Validate packs
        run: python3 tools/validate.py
